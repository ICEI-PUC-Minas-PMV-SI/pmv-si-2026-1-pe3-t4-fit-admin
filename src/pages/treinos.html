<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Treinos - Fit-Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <link rel="stylesheet" href="../styles/theme.css">
  <link rel="stylesheet" href="../styles/dashboard.css">
  <link rel="stylesheet" href="../styles/gestao.css">
</head>
<body>
  <div class="dashboard-container">
    <header class="dashboard-header">
      <button class="menu-btn"><span class="material-icons">menu</span></button>
      <span class="dashboard-title">Fit-Admin</span>
      <button class="logout-btn"><span class="material-icons">logout</span></button>
    </header>
    <nav class="dashboard-nav">
      <a href="dashboard.html" class="nav-item"><span class="material-icons">home</span><span>Dashboard</span></a>
      <a href="pagamentos.html" class="nav-item"><span class="material-icons">payments</span><span>Pagamentos</span></a>
      <a href="treinos.html" class="nav-item active"><span class="material-icons">fitness_center</span><span>Treinos</span></a>
      <a href="funcionarios.html" class="nav-item admin-only"><span class="material-icons">people</span><span>Funcionários</span></a>
      <a href="alterar-senha.html" class="nav-item"><span class="material-icons">lock_reset</span><span>Senha</span></a>
    </nav>
    <main class="dashboard-main">
      <div class="dashboard-actions">
        <h2>Treinos</h2>
      </div>
      <section class="management-layout">
        <form class="management-form" id="treino-form">
          <h3 id="treino-form-title">Criar treino</h3>
          <input id="treino-id" type="hidden">
          <label for="aluno-id">Aluno</label>
          <select id="aluno-id" required></select>
          <label for="exercicios">Exercícios</label>
          <textarea id="exercicios" rows="4" placeholder="Ex: Supino reto, remada baixa..." required></textarea>
          <label for="series">Séries</label>
          <input id="series" type="text" placeholder="Ex: 3 séries" required>
          <label for="repeticoes">Repetições</label>
          <input id="repeticoes" type="text" placeholder="Ex: 12 repetições" required>
          <label for="carga">Carga</label>
          <input id="carga" type="text" placeholder="Ex: 20kg">
          <label for="observacoes">Observações</label>
          <textarea id="observacoes" rows="3"></textarea>
          <button class="btn-primary" type="submit">Salvar treino</button>
          <button class="btn-outline" id="cancelar-edicao" type="button">Cancelar edição</button>
        </form>
        <section class="management-list">
          <div class="filters-row">
            <input class="search-input" id="busca-treino" type="text" placeholder="Buscar por aluno ou exercício">
          </div>
          <div id="treinos-lista" class="records-list"></div>
        </section>
      </section>
    </main>
  </div>
  <script src="../scripts/auth.js"></script>
  <script src="../scripts/app-data.js"></script>
  <script src="../scripts/treinos.js"></script>
</body>
</html>
